services:
  postgres:
    image: postgres:16-alpine
    container_name: tasweqetbetak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasweqetbetak
      POSTGRES_USER: tasweqet
      POSTGRES_PASSWORD: tasweqet_dev
    ports:
      - "5432:5432"
    volumes:
      - tasweqetbetak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasweqet -d tasweqetbetak"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  tasweqetbetak-postgres-data: