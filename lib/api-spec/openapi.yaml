openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: orders
    description: Customer order operations
  - name: driver
    description: Driver delivery operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/request-otp:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Request OTP for phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: registerOtp
      tags: [auth]
      summary: Request OTP for a new account (signup)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP sent for registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "409":
          description: Phone already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify OTP and create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerify"
      responses:
        "200":
          description: OTP verified, session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/location:
    patch:
      operationId: updateLocation
      tags: [auth]
      summary: Save user location after login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Location saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSaveResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customer/address:
    get:
      operationId: getCustomerAddress
      tags: [auth]
      summary: Get the customer's saved delivery address
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Saved address (fields are null when not set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddress"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: saveCustomerAddress
      tags: [auth]
      summary: Save or replace the customer's single delivery address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAddressInput"
      responses:
        "200":
          description: Address saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddress"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customer/address/geocode:
    post:
      operationId: reverseGeocode
      tags: [auth]
      summary: Resolve coordinates to a human-readable Arabic address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Resolved address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodeResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Geocoding provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customer/address/search:
    get:
      operationId: searchAddress
      tags: [auth]
      summary: Address autocomplete search (Egypt only)
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 3
      responses:
        "200":
          description: Matching places
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AddressSearchResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Geocoding provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    post:
      operationId: placeOrder
      tags: [orders]
      summary: Convert the authenticated customer's cart into restaurant orders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPlacementInput"
      responses:
        "201":
          description: Orders created and cart cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPlacementResult"
        "400":
          description: Empty cart, missing address, or invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A cart item is no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Payment gateway could not initialize a checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Online payment is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listCustomerOrders
      tags: [orders]
      summary: List the authenticated customer's orders newest first
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getCustomerOrder
      tags: [orders]
      summary: Get an authenticated customer's order detail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "400":
          description: Invalid order id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/driver-location:
    get:
      operationId: getOrderDriverLocation
      tags: [orders]
      summary: Get the assigned driver's last-known location for a customer order
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Last-known driver location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverLocation"
        "400":
          description: Invalid order id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver/location:
    post:
      operationId: updateDriverLocation
      tags: [driver]
      summary: Save the authenticated driver's current GPS location
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverLocationUpdate"
      responses:
        "200":
          description: Saved driver location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverLocation"
        "400":
          description: Invalid coordinates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Driver is not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver/orders/active:
    get:
      operationId: getActiveDriverOrder
      tags: [driver]
      summary: Get the authenticated driver's current delivery
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active delivery or null when none is assigned
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DriverActiveOrder"
                  - type: "null"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Driver is not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver/orders/available:
    get:
      operationId: getAvailableDriverOrder
      tags: [driver]
      summary: Get the next unassigned ready delivery offer
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available delivery offer or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DriverOrderOffer"
                  - type: "null"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Driver is not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver/orders/{id}/accept:
    post:
      operationId: acceptDriverOrder
      tags: [driver]
      summary: Atomically accept an unassigned ready delivery
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Accepted delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOrderStatusResult"
        "400":
          description: Invalid order id or driver already has an active delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Driver is not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Delivery offer was already accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partner/orders:
    get:
      operationId: listPartnerOrders
      tags: [orders]
      summary: List orders belonging to the authenticated partner restaurant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Restaurant orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartnerOrderSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Partner restaurant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partner/orders/{id}:
    get:
      operationId: getPartnerOrder
      tags: [orders]
      summary: Get an authenticated partner restaurant order
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Restaurant order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerOrderDetail"
        "400":
          description: Invalid order id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Order does not belong to this restaurant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partner/orders/{id}/status:
    patch:
      operationId: updatePartnerOrderStatus
      tags: [orders]
      summary: Advance a restaurant-owned order through confirmation and preparation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerOrderStatusUpdate"
      responses:
        "200":
          description: Updated order state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOrderStatusResult"
        "400":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Order does not belong to this restaurant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver/orders/{id}/status:
    patch:
      operationId: updateDriverOrderStatus
      tags: [driver]
      summary: Advance an assigned order to picked up or delivered
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverOrderStatusUpdate"
      responses:
        "200":
          description: Updated order state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOrderStatusResult"
        "400":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Driver is not approved or not assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/{id}:
    get:
      operationId: getPaymentSession
      tags: [orders]
      summary: Get an authenticated customer's Paymob checkout status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Payment session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSession"
        "400":
          description: Invalid payment session id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Payment session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /onboard/partner:
    post:
      operationId: onboardPartner
      tags: [auth]
      summary: Submit restaurant onboarding application
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerOnboard"
      responses:
        "200":
          description: Application saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /onboard/driver:
    post:
      operationId: onboardDriver
      tags: [auth]
      summary: Submit driver onboarding application
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverOnboard"
      responses:
        "200":
          description: Application saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads:
    post:
      operationId: uploadFile
      tags: [storage]
      summary: Upload a file through the server (enforces 10 MB limit and magic-byte MIME validation)
      description: |
        Send raw file bytes as the request body. The Content-Type header must be
        an image type or application/pdf, but the server validates the actual bytes
        via magic-byte detection and rejects mismatches. Maximum body size is 10 MB.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
          image/bmp:
            schema:
              type: string
              format: binary
          image/tiff:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadFileResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid file type or empty body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File exceeds 10 MB limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/restaurants:
    get:
      operationId: listRestaurantApplications
      tags: [auth]
      summary: List submitted restaurant applications
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RestaurantApplication"

  /admin/drivers:
    get:
      operationId: listDriverApplications
      tags: [auth]
      summary: List submitted driver applications
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DriverApplication"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PartnerOnboard:
      type: object
      required: [name, address]
      properties:
        ownerName:
          type: string
        email:
          type: string
        name:
          type: string
          minLength: 1
        description:
          type: string
        phone:
          type: string
        address:
          type: string
          minLength: 1
        branches:
          type: number
        hours:
          type: string
        category:
          type: string
          description: Comma-separated category ids
        deliveryType:
          type: string
          enum: [restaurant, platform]
        logoUrl:
          type: string
          description: Object storage path for the restaurant logo
        coverUrl:
          type: string
          description: Object storage path for the restaurant cover image

    DriverOnboard:
      type: object
      required: [fullName, area, vehicleType]
      properties:
        fullName:
          type: string
          minLength: 1
        area:
          type: string
          minLength: 1
        vehicleType:
          type: string
          minLength: 1
        documents:
          type: string
          description: Comma-separated ids of uploaded documents
        nationalIdFrontUrl:
          type: string
          description: Object storage path for national ID front
        nationalIdBackUrl:
          type: string
          description: Object storage path for national ID back
        criminalRecordUrl:
          type: string
          description: Object storage path for criminal record
        licenseUrl:
          type: string
          description: Object storage path for driver license

    OnboardResult:
      type: object
      required: [success, id, status]
      properties:
        success:
          type: boolean
        id:
          type: number
        status:
          type: string

    RestaurantApplication:
      type: object
      required: [id, name, address, deliveryType, status, ownerUserId]
      properties:
        id:
          type: number
        ownerUserId:
          type: number
        ownerName:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        name:
          type: string
        description:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: string
        branches:
          type: number
        hours:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        deliveryType:
          type: string
        logoUrl:
          type: ["string", "null"]
        coverUrl:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string

    DriverApplication:
      type: object
      required: [id, userId, fullName, area, vehicleType, status]
      properties:
        id:
          type: number
        userId:
          type: number
        fullName:
          type: string
        area:
          type: string
        vehicleType:
          type: string
        documents:
          type: ["string", "null"]
        nationalIdFrontUrl:
          type: ["string", "null"]
        nationalIdBackUrl:
          type: ["string", "null"]
        criminalRecordUrl:
          type: ["string", "null"]
        licenseUrl:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string

    UploadFileResponse:
      type: object
      required: [objectPath]
      properties:
        objectPath:
          type: string
          description: Normalised storage path (e.g. /objects/uploads/uuid) to reference in onboarding payloads

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    OtpRequest:
      type: object
      required: [phone, role]
