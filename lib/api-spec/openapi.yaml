openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: orders
    description: Customer order operations
  - name: driver
    description: Driver delivery operations
  - name: storage
    description: Private customer-uploaded object operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Database and operations-worker readiness check
      responses:
        "200":
          description: Core services are ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503":
          description: A critical readiness condition is active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /auth/capabilities:
    get:
      operationId: getAuthCapabilities
      tags: [auth]
      summary: Read secret-free public authentication capabilities
      description: Unauthenticated runtime capability discovery for the login UI.
      responses:
        "200":
          description: Public authentication capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCapabilities"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/request-otp:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Request OTP for phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginOtpInput"
      responses:
        "200":
          description: OTP requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: registerOtp
      tags: [auth]
      summary: Request OTP for a new account (signup)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP sent for registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "409":
          description: Phone already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/dev-register:
    post:
      operationId: devRegister
      tags: [auth]
      summary: Create a fresh development signup account
      description: >
        Test-profile only. Creates a new fixture user with a server-generated
        synthetic phone identity, without invoking OTP or an external provider,
        and returns the normal database-backed session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevRegisterInput"
      responses:
        "200":
          description: Fresh development account and authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin signup is forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Development signup is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify OTP and create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerify"
      responses:
        "200":
          description: OTP verified, session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Phone was registered while OTP verification was in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/location:
    patch:
      operationId: updateLocation
      tags: [auth]
      summary: Save user location after login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Location saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSaveResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Invalidate the current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /auth/rotate:
    post:
      operationId: rotateSession
      tags: [auth]
      summary: Rotate the current bearer session
      description: Atomically revokes the presented session and returns a replacement token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Session is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update the authenticated user's persisted profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileUpdateResult"
        "400":
          description: Invalid profile input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customer/address:
    get:
      operationId: getCustomerAddress
      tags: [auth]
      summary: Get the customer's saved delivery address
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Saved address (fields are null when not set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddress"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: saveCustomerAddress
      tags: [auth]
      summary: Save or replace the customer's single delivery address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAddressInput"
      responses:
        "200":
          description: Address saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddress"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customer/address/geocode:
    post:
      operationId: reverseGeocode
      tags: [auth]
      summary: Resolve coordinates to a human-readable Arabic address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Resolved address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodeResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Geocoding provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customer/address/search:
    get:
      operationId: searchAddress
      tags: [auth]
      summary: Address autocomplete search (Egypt only)
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 3
      responses:
        "200":
          description: Matching places
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AddressSearchResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Geocoding provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customer/wallet:
    get:
      operationId: getCustomerWallet
      tags: [orders]
      summary: Get the authenticated customer's wallet balance and paginated ledger
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Wallet balance and ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerWallet"
        "400":
          description: Invalid pagination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/capabilities:
    get:
      operationId: getPaymentCapabilities
      tags: [orders]
      summary: Read secret-free online payment availability
      description: Reports local Paymob checkout readiness without contacting the provider.
      responses:
        "200":
          description: Public payment capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCapabilities"

  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get the authenticated customer's cart with checkout delivery estimates
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current cart grouped by restaurant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    post:
      operationId: placeOrder
      tags: [orders]
      summary: Convert the authenticated customer's cart into restaurant orders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPlacementInput"
      responses:
        "201":
          description: Orders created and cart cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPlacementResult"
        "400":
          description: Empty cart, missing address, or invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A cart item is unavailable or a restaurant is not accepting orders (code RESTAURANT_NOT_ACCEPTING)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Payment gateway could not initialize a checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Online payment is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listCustomerOrders
      tags: [orders]
      summary: List the authenticated customer's orders newest first
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getCustomerOrder
      tags: [orders]
      summary: Get an authenticated customer's order detail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "400":
          description: Invalid order id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/cancel:
    post:
      operationId: cancelCustomerOrder
      tags: [orders]
      summary: Cancel a customer-owned order before preparation starts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderActionResult"
        "202":
          description: Provider refund outcome requires reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderActionResult"
        "400":
          description: Invalid order or cancellation is no longer allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Payment provider rejected the refund
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/refund:
    post:
      operationId: createCustomerRefundRequest
      tags: [orders]
      summary: Submit a full-order wallet refund request for admin review
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequestInput"
      responses:
        "201":
          description: Refund request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundRequest"
        "400":
          description: Order is not eligible or reason is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A refund request already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve an authenticated private object
      description: |
        Returns a private object after the existing server-side ACL check.
        Refund proof paths are readable by their owning customer or an active
        admin with refunds.read.
      security:
        - bearerAuth: []
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path below /objects/, including nested segments.
      responses:
        "200":
          description: Private object bytes
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Object access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/refund-proof:
    post:
      operationId: uploadCustomerRefundProof
      tags: [orders, storage]
      summary: Upload the photo proof for a customer refund request
      description: |
        Uploads one JPEG, PNG, or WebP image as raw bytes. The server checks
        the image signature and binds the resulting private object path to the
        authenticated customer's delivered order.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Private proof object created and bound to the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundProofUploadResponse"
        "400":
          description: Invalid order or image bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Customer authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Customer-owned order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order is not eligible or already has a submitted refund
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Image exceeds the 10 MB limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/driver-location:
    get:
      operationId: getOrderDriverLocation
      tags: [orders]
      summary: Get the assigned driver's last-known location for a customer order
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Last-known driver location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverLocation"
        "400":
          description: Invalid order id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver/location:
    post:
      operationId: updateDriverLocation
      tags: [driver]
      summary: Save the authenticated driver's current GPS location
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverLocationUpdate"
      responses:
        "200":
          description: Saved driver location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverLocation"
        "400":
          description: Invalid coordinates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Driver is not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver/dispatch-location:
    post:
      operationId: updateDriverDispatchLocation
      tags: [driver]
      summary: Save a coarse foreground-only location for idle dispatch matching
      description: A foreground-only one-shot refresh. The server rounds coordinates to two decimal places. The driver must be approved, online, available, and have no active delivery.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverDispatchLocationUpdate"
      responses:
        "200":
          description: Coarse dispatch location saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverDispatchLocationResult"
        "400":
          description: Coordinates are invalid or outside Egypt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Driver is not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Driver is offline, unavailable, or has active work
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver/orders/active:
    get:
      operationId: getActiveDriverOrder
      tags: [driver]
      summary: Get the authenticated driver's current delivery
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active delivery or null when none is assigned
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DriverActiveOrder"
                  - type: "null"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Driver is not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver/orders/available:
    get:
      operationId: getAvailableDriverOrder
      tags: [driver]
      summary: Get the next unassigned ready delivery offer
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available delivery offer or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DriverOrderOffer"
                  - type: "null"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Driver is not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver/orders/{id}/accept:
    post:
      operationId: acceptDriverOrder
      tags: [driver]
      summary: Atomically accept an unassigned ready delivery
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Accepted delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOrderStatusResult"
        "400":
          description: Invalid order id or driver already has an active delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Driver is not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Delivery offer was already accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver/availability:
    put:
      operationId: updateDriverAvailability
      tags: [driver]
      summary: Persist the approved driver's online and offer availability state
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
