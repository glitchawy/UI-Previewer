  /storage/uploads:
    post:
      operationId: uploadFile
      tags: [storage]
      summary: Upload a file through the server (enforces 10 MB limit and magic-byte MIME validation)
      description: |
        Send raw file bytes as the request body. The Content-Type header must be
        an image type or application/pdf, but the server validates the actual bytes
        via magic-byte detection and rejects mismatches. Maximum body size is 10 MB.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
          image/bmp:
            schema:
              type: string
              format: binary
          image/tiff:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: File uploaded successfully
          content:
