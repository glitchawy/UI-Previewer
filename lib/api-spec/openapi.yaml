openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/request-otp:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Request OTP for phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: registerOtp
      tags: [auth]
      summary: Request OTP for a new account (signup)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP sent for registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "409":
          description: Phone already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify OTP and create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerify"
      responses:
        "200":
          description: OTP verified, session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/location:
    patch:
      operationId: updateLocation
      tags: [auth]
      summary: Save user location after login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Location saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSaveResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customer/address:
    get:
      operationId: getCustomerAddress
      tags: [auth]
      summary: Get the customer's saved delivery address
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Saved address (fields are null when not set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddress"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: saveCustomerAddress
      tags: [auth]
      summary: Save or replace the customer's single delivery address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAddressInput"
      responses:
        "200":
          description: Address saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddress"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customer/address/geocode:
    post:
      operationId: reverseGeocode
      tags: [auth]
      summary: Resolve coordinates to a human-readable Arabic address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Resolved address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodeResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Geocoding provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customer/address/search:
    get:
      operationId: searchAddress
      tags: [auth]
      summary: Address autocomplete search (Egypt only)
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 3
      responses:
        "200":
          description: Matching places
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AddressSearchResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Geocoding provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /onboard/partner:
    post:
      operationId: onboardPartner
      tags: [auth]
      summary: Submit restaurant onboarding application
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerOnboard"
      responses:
        "200":
          description: Application saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /onboard/driver:
    post:
      operationId: onboardDriver
      tags: [auth]
      summary: Submit driver onboarding application
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverOnboard"
      responses:
        "200":
          description: Application saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads:
    post:
      operationId: uploadFile
      tags: [storage]
      summary: Upload a file through the server (enforces 10 MB limit and magic-byte MIME validation)
      description: |
        Send raw file bytes as the request body. The Content-Type header must be
        an image type or application/pdf, but the server validates the actual bytes
        via magic-byte detection and rejects mismatches. Maximum body size is 10 MB.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
          image/bmp:
            schema:
              type: string
              format: binary
          image/tiff:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadFileResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid file type or empty body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File exceeds 10 MB limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/restaurants:
    get:
      operationId: listRestaurantApplications
      tags: [auth]
      summary: List submitted restaurant applications
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RestaurantApplication"

  /admin/drivers:
    get:
      operationId: listDriverApplications
      tags: [auth]
      summary: List submitted driver applications
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DriverApplication"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PartnerOnboard:
      type: object
      required: [name, address]
      properties:
        ownerName:
          type: string
        email:
          type: string
        name:
          type: string
          minLength: 1
        description:
          type: string
        phone:
          type: string
        address:
          type: string
          minLength: 1
        branches:
          type: number
        hours:
          type: string
        category:
          type: string
          description: Comma-separated category ids
        deliveryType:
          type: string
          enum: [restaurant, platform]
        logoUrl:
          type: string
          description: Object storage path for the restaurant logo
        coverUrl:
          type: string
          description: Object storage path for the restaurant cover image

    DriverOnboard:
      type: object
      required: [fullName, area, vehicleType]
      properties:
        fullName:
          type: string
          minLength: 1
        area:
          type: string
          minLength: 1
        vehicleType:
          type: string
          minLength: 1
        documents:
          type: string
          description: Comma-separated ids of uploaded documents
        nationalIdFrontUrl:
          type: string
          description: Object storage path for national ID front
        nationalIdBackUrl:
          type: string
          description: Object storage path for national ID back
        criminalRecordUrl:
          type: string
          description: Object storage path for criminal record
        licenseUrl:
          type: string
          description: Object storage path for driver license

    OnboardResult:
      type: object
      required: [success, id, status]
      properties:
        success:
          type: boolean
        id:
          type: number
        status:
          type: string

    RestaurantApplication:
      type: object
      required: [id, name, address, deliveryType, status, ownerUserId]
      properties:
        id:
          type: number
        ownerUserId:
          type: number
        ownerName:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        name:
          type: string
        description:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: string
        branches:
          type: number
        hours:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        deliveryType:
          type: string
        logoUrl:
          type: ["string", "null"]
        coverUrl:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string

    DriverApplication:
      type: object
      required: [id, userId, fullName, area, vehicleType, status]
      properties:
        id:
          type: number
        userId:
          type: number
        fullName:
          type: string
        area:
          type: string
        vehicleType:
          type: string
        documents:
          type: ["string", "null"]
        nationalIdFrontUrl:
          type: ["string", "null"]
        nationalIdBackUrl:
          type: ["string", "null"]
        criminalRecordUrl:
          type: ["string", "null"]
        licenseUrl:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string

    UploadFileResponse:
      type: object
      required: [objectPath]
      properties:
        objectPath:
          type: string
          description: Normalised storage path (e.g. /objects/uploads/uuid) to reference in onboarding payloads

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    OtpRequest:
      type: object
      required: [phone, role]
      properties:
        phone:
          type: string
          description: Phone number in Egyptian format e.g. 01012345678
        role:
          type: string
          enum: [customer, partner, driver, admin]

    OtpRequestResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string

    OtpVerify:
      type: object
      required: [phone, otp, role, type]
      properties:
        phone:
          type: string
        otp:
          type: string
          description: 6-digit OTP code
        role:
          type: string
          enum: [customer, partner, driver, admin]
        type:
          type: string
          enum: [login, register]
          description: login = existing user only; register = new user only

    AuthUser:
      type: object
      required: [id, phone, role]
      properties:
        id:
          type: number
        phone:
          type: string
        role:
          type: string
        name:
          type: ["string", "null"]
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        addressText:
          type: ["string", "null"]
        addressDetails:
          type: ["string", "null"]

    AuthSession:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"

    LocationUpdate:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
        lng:
          type: number

    LocationSaveResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    CustomerAddress:
      type: object
      required: [addressText, lat, lng]
      properties:
        addressText:
          type: ["string", "null"]
        addressDetails:
          type: ["string", "null"]
        placeId:
          type: ["string", "null"]
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]

    CustomerAddressInput:
      type: object
      required: [lat, lng, addressText]
      properties:
        lat:
          type: number
        lng:
          type: number
        addressText:
          type: string
          minLength: 1
        addressDetails:
          type: string
          description: Building, floor, apartment, landmark — free text
        placeId:
          type: string

    GeocodeResult:
      type: object
      required: [addressText]
      properties:
        addressText:
          type: string
        provider:
          type: string
          description: Which geocoding provider resolved the address

    AddressSearchResult:
      type: object
      required: [label, lat, lng]
      properties:
        label:
          type: string
        lat:
          type: number
        lng:
          type: number
        placeId:
          type: ["string", "null"]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
