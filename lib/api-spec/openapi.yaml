components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    AuthCapabilities:
      type: object
      additionalProperties: false
      required: [publicTestLoginEnabled, deploymentProfile]
      properties:
        publicTestLoginEnabled: { type: boolean }
        deploymentProfile:
          type: string
          enum: [unknown, customer, test]

    DevRegisterInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [customer, partner, driver, admin]
          description: Admin is rejected explicitly; it is included so callers receive the forbidden-role response.

    PaymentCapabilities:
      type: object
      additionalProperties: false
      required: [cardPaymentsAvailable, provider, status]
      properties:
        cardPaymentsAvailable: { type: boolean }
        provider:
          type: string
          const: paymob
        status:
          type: string
          enum: [available, unavailable]
    AdminObject:
      type: object
      additionalProperties: true
    AdminMutation:
      type: object
      additionalProperties: true
    AdminPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminObject" } }
        page: { type: number }
        pageSize: { type: number }
        total: { type: number }
        totalPages: { type: number }
    AdminOverview:
      type: object
      required: [gmv, orders, activeOrders, customers, restaurants, activeRestaurants, activeDrivers, topRestaurants, monthly]
      properties:
        gmv: { type: number }
        orders: { type: number }
        activeOrders: { type: number }
        customers: { type: number }
        restaurants: { type: number }
        activeRestaurants: { type: number }
        activeDrivers: { type: number }
        topRestaurants:
          type: array
          items:
            type: object
            required: [id, name, orders, gmv]
            properties:
              id: { type: number }
              name: { type: string }
              orders: { type: number }
              gmv: { type: number }
        monthly:
          type: array
          items:
            type: object
            required: [month, orders, gmv]
            properties:
              month: { type: string }
              orders: { type: number }
              gmv: { type: number }
    AdminOrderPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminOrderSummary" } }
        page: { type: number }
        pageSize: { type: number }
        total: { type: number }
        totalPages: { type: number }
    AdminOrderSummary:
      type: object
      additionalProperties: false
      required: [id, code, customerId, customerName, customerPhone, restaurantName, status, paymentMethod, paymentStatus, total, walletAmountUsed, createdAt]
      properties:
        id: { type: number }
        code: { type: string }
        customerId: { type: number }
        customerName: { type: [string, "null"] }
        customerPhone: { type: [string, "null"] }
        restaurantName: { type: string }
        status: { type: string }
        paymentMethod: { type: string, enum: [cash, card] }
        paymentStatus: { type: string }
        total: { type: number }
        walletAmountUsed: { type: number }
        createdAt: { type: string, format: date-time }
    AdminEligibleDriver:
      type: object
      additionalProperties: false
      required: [id, fullName, area, currentWorkload, distanceKm, locationUpdatedAt]
      properties:
        id: { type: number }
        fullName: { type: string }
        area: { type: string }
        currentWorkload: { type: number }
        distanceKm: { type: number }
        locationUpdatedAt: { type: string, format: date-time }
    AdminOrderDetail:
      type: object
      additionalProperties: false
      required: [id, code, status, paymentMethod, paymentStatus, restaurantName, branchName, deliveryAddressText, notes, subtotal, deliveryFee, total, walletAmountUsed, externalAmountDue, createdAt, customer, restaurant, driver, dispatchStatus, items, history, refunds, relatedOrders]
      properties:
        id: { type: number }
        code: { type: string }
        status: { type: string }
        paymentMethod: { type: string, enum: [cash, card] }
        paymentStatus: { type: string }
        restaurantName: { type: string }
        branchName: { type: [string, "null"] }
        deliveryAddressText: { type: string }
        notes: { type: [string, "null"] }
        subtotal: { type: number }
        deliveryFee: { type: number }
        total: { type: number }
        walletAmountUsed: { type: number }
        externalAmountDue: { type: number }
        createdAt: { type: string, format: date-time }
        customer:
          type: object
          additionalProperties: false
          required: [id, name, phone, walletBalance]
          properties:
            id: { type: number }
            name: { type: [string, "null"] }
            phone: { type: [string, "null"] }
            walletBalance: { type: number }
        restaurant:
          type: object
          additionalProperties: false
          required: [id, name, status]
          properties:
            id: { type: number }
            name: { type: string }
            status: { type: [string, "null"] }
        driver:
          type: [object, "null"]
          additionalProperties: false
          required: [id, name, phone, area]
          properties:
            id: { type: number }
            name: { type: string }
            phone: { type: [string, "null"] }
            area: { type: string }
        dispatchStatus:
          type: object
          additionalProperties: false
          required: [state, nextRetryAt, offerExpiresAt, reason]
          properties:
            state: { type: string, enum: [not_started, actively_offered, retry_scheduled, assigned, terminal] }
            nextRetryAt: { type: [string, "null"], format: date-time }
            offerExpiresAt: { type: [string, "null"], format: date-time }
            reason: { type: [string, "null"] }
        items:
          type: array
          items: { type: object, additionalProperties: true }
        history:
          type: array
          items: { type: object, additionalProperties: true }
        refunds:
          type: array
          items: { type: object, additionalProperties: true }
        relatedOrders:
          type: array
          items: { type: object, additionalProperties: true }
    AdminOperationsHealth:
      type: object
      additionalProperties: false
      required: [worker, pendingWebhookEvents, deadWebhookEvents, notificationDeadLetters, cashReconciliationDeadLetters, staleReadyOrders, notificationFailures, alerts, configuration]
      properties:
        worker:
          type: [object, "null"]
          additionalProperties: false
